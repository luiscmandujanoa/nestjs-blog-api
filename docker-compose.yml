services:
    postgres:
        image: postgres:15
        environment:
            POSTGRES_DB: blog_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
    
    redis:
        image: redis:7
        ports:
            - '6379:6379'

    postgres-test:
        image: postgres:15
        environment:
            POSTGRES_DB: blog_db_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5433:5432'

    prometheus:
        image: prom/prometheus
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - '9090:9090'

    grafana:
        image: grafana/grafana
        ports:
            - '3001:3000'
        depends_on:
            - prometheus

volumes:
    pgdata:
